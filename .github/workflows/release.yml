name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to cut (e.g. v1.0.0 or v0.0.1-beta)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init:
    name: Initialize Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
      is_beta: ${{ steps.resolve_tag.outputs.is_beta }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Tag and Beta Status
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ -(beta|alpha|rc) || "$TAG" == *beta* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "Identified Beta pre-release tag: $TAG"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "Identified Stable release tag: $TAG"
          fi

          # If triggered manually and tag does not exist yet on remote, create and push it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists locally."
            else
              echo "Creating and pushing tag $TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'tarsier/go.mod'
          cache-dependency-path: 'tarsier/go.sum'
          cache: true

      - name: Run go vet
        working-directory: tarsier
        run: go vet ./...

      - name: Run unit tests with race detector
        working-directory: tarsier
        run: go test -race -v ./...

  goreleaser:
    name: Build Binaries & Publish Release
    runs-on: ubuntu-latest
    needs: [init, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.init.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'tarsier/go.mod'
          cache-dependency-path: 'tarsier/go.sum'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    needs: [init, test, goreleaser]
    # Skip Docker image generation and registry push for beta pre-releases
    if: needs.init.outputs.is_beta != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.init.outputs.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/tarsier" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ needs.init.outputs.tag_name }}
            type=semver,pattern={{version}},value=${{ needs.init.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.init.outputs.tag_name }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.init.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
